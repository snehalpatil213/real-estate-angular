<section class="testimonials">

    <div class="container">

        <!--=========================
            SECTION HEADING
        ==========================-->

        <div class="section-heading">

            <span class="section-tag">
                Client Testimonials
            </span>

            <h2>
                What Our Happy Clients Say
            </h2>

            <p>
                Discover why hundreds of families and investors trust
                Horizon Properties for buying, selling and investing in
                premium real estate.
            </p>

        </div>

        <!--=========================
            SLIDER
        ==========================-->

        <div class="testimonial-slider">

            <!-- Previous Button -->

            <button
                class="slider-btn prev"
                (click)="previousSlide()">

                <i class="bi bi-arrow-left"></i>

            </button>

            <!-- Cards -->

            <div class="slider-wrapper">

                <div
                    class="testimonial-card"
                    *ngFor="let item of visibleTestimonials">

                    <!-- Quote -->

                    <div class="quote-icon">

                        <i class="bi bi-quote"></i>

                    </div>

                    <!-- Stars -->

                    <div class="stars">

                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-fill"></i>

                    </div>

                    <!-- Review -->

                    <p class="review">

                        {{ item.review }}

                    </p>

                    <!-- Client -->

                    <div class="client">

                        <img
                            [src]="item.image"
                            [alt]="item.name">

                        <div>

                            <h4>

                                {{ item.name }}

                            </h4>

                            <span>

                                {{ item.role }}

                            </span>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Next Button -->

            <button
                class="slider-btn next"
                (click)="nextSlide()">

                <i class="bi bi-arrow-right"></i>

            </button>

        </div>

        <!--=========================
            PAGINATION
        ==========================-->

        <div class="pagination">

            <span

                *ngFor="let item of testimonials; let i = index"

                [class.active]="i === currentIndex"

                (click)="goToSlide(i)">

            </span>

        </div>

    </div>

</section>
