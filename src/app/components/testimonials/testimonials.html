<section class="testimonials">

  <div class="container">

    <!--=========================
        SECTION HEADING
    =========================-->

    <div class="section-heading">

      <span class="common-subtitle">
        Client Testimonials
      </span>

      <h2 class="common-title">
        What Our Happy Clients Say
      </h2>

      <p class="common-description">
        Discover why hundreds of families and investors trust
        Horizon Properties for buying, selling and investing in
        premium real estate.
      </p>

    </div>


    <!--=========================
        SLIDER
    =========================-->

    <div class="testimonial-slider">

      <!-- Previous Button -->

      <button
        type="button"
        class="slider-btn prev"
        (click)="previousSlide()">

        <i class="bi bi-arrow-left"></i>

      </button>


      <!-- Cards -->

      <div class="slider-wrapper">

        <div
          class="testimonial-card"
          *ngFor="let item of visibleTestimonials">

          <!-- Quote -->

          <div class="quote-icon">

            <i class="bi bi-quote"></i>

          </div>


          <!-- Stars -->

          <div class="stars">

            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>

          </div>


          <!-- Review -->

          <p class="common-card-subtitle review">

            {{ item.review }}

          </p>


          <!-- Client -->

          <div class="client">

            <img
              [src]="item.image"
              [alt]="item.name">


            <div>

              <h4 class="common-card-title">

                {{ item.name }}

              </h4>

              <span class="common-small-text">

                {{ item.role }}

              </span>

            </div>

          </div>

        </div>

      </div>


      <!-- Next Button -->

      <button
        type="button"
        class="slider-btn next"
        (click)="nextSlide()">

        <i class="bi bi-arrow-right"></i>

      </button>

    </div>


    <!--=========================
        PAGINATION
    =========================-->

    <div class="pagination">

      <span
        *ngFor="let item of testimonials; let i = index"
        [class.active]="i === currentIndex"
        (click)="goToSlide(i)">
      </span>

    </div>

  </div>

</section>
