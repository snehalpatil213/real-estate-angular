<section class="luxury-amenities">

    <div class="container">

        <!-- =========================
             SECTION HEADER
        ========================== -->

        <div class="common-section-header">

            <span class="common-subtitle">
                Luxury Amenities
            </span>

            <h2 class="common-title">
                Experience Premium Living
            </h2>

            <p class="common-description">
                Discover world-class amenities and facilities designed
                to elevate your lifestyle every day.
            </p>

        </div>


        <!-- =========================
             AMENITIES GRID
        ========================== -->

        <div class="amenities-grid">

            @for(item of amenities; track item.title){

                <div class="amenity-card common-card">

                    <!-- ICON -->

                    <div class="amenity-icon common-icon">

                        <i
                            class="bi"
                            [class]="item.icon">
                        </i>

                    </div>


                    <!-- TITLE -->

                    <h3 class="common-card-title">

                        {{ item.title }}

                    </h3>


                    <!-- DIVIDER -->

                    <div class="amenity-line"></div>


                    <!-- DESCRIPTION -->

                    <p class="common-card-subtitle">

                        {{ item.description }}

                    </p>

                </div>

            }

        </div>


        <!-- =========================
             BOTTOM BANNER
        ========================== -->

        <div class="amenities-footer">

            <div class="amenities-footer-icon common-icon">

                <i class="bi bi-stars"></i>

            </div>

            <h4 class="common-card-title">

                Premium Amenities for a Comfortable
                & Luxurious Lifestyle

            </h4>

        </div>

    </div>

</section>
