<header class="header">

  <div class="nav-container">

    <!-- Logo -->
    <div class="logo">

      <a href="#" class="logo-link">

        <div class="logo-icon">
          <i class="bi bi-buildings"></i>
        </div>

        <div class="logo-text">
          <h2>HORIZON</h2>
          <span>PROPERTIES</span>
        </div>

      </a>

    </div>


    <!-- Navigation -->
    <nav class="navbar" [class.active]="isMenuOpen">

      <ul>

        <!-- Home -->
        <li>
          <a
            routerLink="/"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }">
            Home
          </a>
        </li>


        <!-- About -->
        <li>
          <a
            routerLink="/about"
            routerLinkActive="active-link">
            About Us
          </a>
        </li>


        <!-- Properties Dropdown -->
        <li class="dropdown">

          <a
            routerLink="/properties"
            routerLinkActive="active-link">

            Properties
            <i class="bi bi-chevron-down"></i>

          </a>


          <ul class="dropdown-menu">

            <li>
              <a routerLink="/properties">
                All Properties
              </a>
            </li>

            <li>
              <a routerLink="/apartments">
                Apartments
              </a>
            </li>

            <li>
              <a routerLink="/villas">
                Villas
              </a>
            </li>

            <li>
              <a routerLink="/luxury-homes">
                Luxury Homes
              </a>
            </li>

            <li>
              <a routerLink="/plots">
                Plots &amp; Land
              </a>
            </li>

          </ul>

        </li>


        <!-- Services -->
        <li>
          <a
            routerLink="/services"
            routerLinkActive="active-link">
            Services
          </a>
        </li>


        <!-- Blog -->
        <li>
          <a
            routerLink="/blog"
            routerLinkActive="active-link">
            Blog
          </a>
        </li>


        <!-- Contact -->
        <li>
          <a
            routerLink="/contact"
            routerLinkActive="active-link">
            Contact
          </a>
        </li>

      </ul>

    </nav>


    <!-- Header Actions -->
    <div class="header-actions">

      <!-- Get In Touch Button -->
      <button class="header-btn">
        Get In Touch
        <i class="bi bi-telephone-fill"></i>
      </button>


      <!-- Mobile Menu Button -->
      <button
        type="button"
        class="menu-btn"
        (click)="toggleMenu()"
        aria-label="Toggle navigation menu">

        <i
          class="bi"
          [ngClass]="isMenuOpen ? 'bi-x-lg' : 'bi-list'">
        </i>

      </button>

    </div>

  </div>

</header>
