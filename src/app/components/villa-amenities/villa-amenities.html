<section class="villa-amenities">

    <div class="container">

        <!--=========================================-->
        <!-- SECTION HEADER -->
        <!--=========================================-->

        <div class="section-header">

            <span class="section-subtitle">

                Villa Amenities

            </span>

            <h2>

                Experience Premium Living

            </h2>

            <p>

                Discover world-class amenities thoughtfully designed
                to bring comfort, convenience and luxury into your everyday life.

            </p>

        </div>

        <!--=========================================-->
        <!-- AMENITIES GRID -->
        <!--=========================================-->

        <div class="amenities-grid">

            @for(item of amenities; track item.title){

            <div class="amenity-card">

                <!-- Icon -->

                <div class="amenity-icon">

                    <i class="bi {{ item.icon }}"></i>

                </div>

                <!-- Content -->

                <div class="amenity-content">

                    <h3>

                        {{ item.title }}

                    </h3>

                    <p>

                        {{ item.description }}

                    </p>

                    <span class="card-line"></span>

                </div>

            </div>

            }

        </div>

    </div>

</section>
