<section class="premium-lifestyle">

    <div class="container">

        <!-- SECTION HEADER -->

        <div class="common-section-header">

            <span class="common-subtitle">
                Luxury Amenities
            </span>

            <h2 class="common-title">
                Experience Premium Living
            </h2>

            <p class="common-description">
                Discover world-class amenities and facilities
                designed to elevate your lifestyle every day.
            </p>

        </div>


        <!-- AMENITIES -->

        <div class="premium-lifestyle-grid">

            @for(amenity of amenities; track amenity.title) {

                <div class="premium-lifestyle-card">

                    <div class="premium-lifestyle-icon">

                        <i class="bi {{ amenity.icon }}"></i>

                    </div>

                    <h3 class="common-card-title">
                        {{ amenity.title }}
                    </h3>

                    <span class="premium-lifestyle-line"></span>

                    <p class="common-card-subtitle">
                        {{ amenity.description }}
                    </p>

                </div>

            }

        </div>


        <!-- BANNER -->

        <div class="premium-lifestyle-banner">

            <div class="premium-lifestyle-banner-icon">

                <i class="bi bi-stars"></i>

            </div>

            <h3 class="common-card-title">
                Premium Amenities for a Comfortable &amp;
                Luxurious Lifestyle
            </h3>

        </div>

    </div>

</section>
