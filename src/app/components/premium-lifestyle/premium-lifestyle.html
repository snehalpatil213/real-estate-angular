<section class="premium-lifestyle">

    <div class="container">

        <div class="section-header">

            <span class="section-subtitle">
                Luxury Amenities
            </span>

            <h2>
                Experience Premium Living
            </h2>

            <p>
                Discover world-class amenities and facilities
                designed to elevate your lifestyle every day.
            </p>

        </div>


        <div class="amenities-grid">

            @for(amenity of amenities; track amenity.title) {

                <div class="amenity-card">

                    <div class="amenity-icon">

                        <i class="bi {{ amenity.icon }}"></i>

                    </div>

                    <h3>
                        {{ amenity.title }}
                    </h3>

                    <span class="amenity-line"></span>

                    <p>
                        {{ amenity.description }}
                    </p>

                </div>

            }

        </div>


        <div class="lifestyle-banner">

            <div class="banner-icon">

                <i class="bi bi-stars"></i>

            </div>

            <h3>
                Premium Amenities for a Comfortable &amp;
                Luxurious Lifestyle
            </h3>

        </div>

    </div>

</section>
